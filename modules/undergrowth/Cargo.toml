# The undergrowth module.
[package]
name = "undergrowth"
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
serde = { version = "1", default-features = false, features = ["derive"] }
serde_json = { version = "1", default-features = false, features = ["alloc"] }

[dev-dependencies]
# Only the tests inflate the portrait PNG to prove the hand-written deflate is real deflate.
miniz_oxide = "0.8"

# Small, and no unwinding across the wasm boundary.
[profile.release]
opt-level = "z"
lto = true
strip = true
panic = "abort"
codegen-units = 1
