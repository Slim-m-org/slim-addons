name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  modules:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/target
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1
        with:
          target: wasm32-unknown-unknown
          cache: false
          rustflags: ""
      # A module's .cargo/config.toml (code-exec needs one) is only read from the directory cargo runs in.
      - name: Test every module
        run: |
          set -euo pipefail
          for dir in modules/*/; do
            [ -f "$dir/Cargo.toml" ] || continue
            [ -f "$dir/Cargo.lock" ] || { echo "::error::$dir has no Cargo.lock; commit one so the build is reproducible"; exit 1; }
            echo "::group::$dir"
            (
              cd "$dir"
              cargo test --locked
            )
            echo "::endgroup::"
          done
      - name: Check every module has unit tests
        run: python3 scripts/check-module-tests.py
      - name: Test the check scripts and the module runner
        run: |
          python3 -m unittest discover -s scripts -p 'test_*.py'
          (cd tools/run-module && cargo test --locked)
      # Rebuilds each module's wasm with scripts/build-wasm.sh and compares it to the pinned one.
      - name: Check the pinned wasm was built from this source
        env:
          EVENT: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          args=()
          if [ "$EVENT" = "pull_request" ]; then
            args=(--base "origin/$BASE_REF")
          fi
          python3 scripts/check-wasm-builds.py "${args[@]}"
      - name: Check the catalogue
        env:
          EVENT: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          args=()
          if [ "$EVENT" = "pull_request" ]; then
            args=(--base "origin/$BASE_REF")
          fi
          python3 scripts/check-catalogue.py "${args[@]}"
      - name: Check every app's scenes
        run: |
          (cd tools/run-module && cargo build --locked --release)
          python3 scripts/check-app-scenes.py target/release/run-module
      - name: Run every command-only module through the wasm abi
        run: python3 scripts/check-command-modules.py target/release/run-module
      - name: Play every game through its script
        run: python3 scripts/play-modules.py target/release/run-module
