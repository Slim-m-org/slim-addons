# SonarQube Cloud analysis scope, read by .github/workflows/sonar.yml.

sonar.projectKey=Slim-m-org_slim-addons
sonar.organization=slim-m-org
sonar.projectName=slim-addons
sonar.sourceEncoding=UTF-8

# Tests are scanned under test rules rather than counted as module code.
sonar.sources=.
sonar.tests=.
sonar.test.inclusions=scripts/test_*.py
sonar.exclusions=\
  scripts/test_*.py,\
  **/target/**,\
  **/__pycache__/**,\
  **/*.wasm

# Every module is its own crate with a copy of the same ABI shim in lib.rs, and
# of the host_call wrapper (host.rs) and its in-memory test double (fake.rs), on
# purpose: a module is cloned from _template and built alone, so the shim is
# repeated by design rather than as debt.
sonar.cpd.exclusions=modules/*/src/lib.rs,modules/*/src/host.rs,modules/*/src/fake.rs

# Coverage is not reported yet, so the gate's coverage-on-new-code condition
# would fail every pull request; excluding everything from coverage leaves it
# with nothing to measure until coverage reports are wired in and this goes.
sonar.coverage.exclusions=**/*
